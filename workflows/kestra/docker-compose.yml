# The operated Kestra service in the current runtime hosting boundary.
#
# Kestra open source and its own PostgreSQL, both on the Coolify-managed server.
# Kestra keeps its state here and never touches the customer database, which is
# what stops its write volume reaching Supabase.
#
# Three deliberate departures from the compose file Kestra publishes:
#
#   1. /var/run/docker.sock is NOT mounted. Kestra's own file mounts it into a
#      container running as root. Anything able to schedule a Docker task could
#      then start a container on the host with any mount it liked, which is root
#      on the box. This platform runs customer-defined workflows, so that mount
#      would hand a tenant the host. The Docker task runner is given up until
#      there is a sandbox to run it in.
#   2. Both images are pinned to exact tags and multi-platform digests. Kestra's
#      published file uses kestra/kestra:latest, which could change the workflow
#      engine during an unrelated deployment. v1.0.57 is the exact deployment
#      verified for this task, but 1.3 is now the current LTS, 1.0 support ends
#      in September 2026, and v1.0.58 exists. Issue #198 owns the forward
#      upgrade and state-database migration rehearsal; see README.md.
#   3. No password is written here. Kestra's file publishes POSTGRES_PASSWORD:
#      k3str4 in its own repository. Every secret below comes from the
#      environment and is held in the secret manager.
#
# Memory limits are set because the server has 8 GB shared with Coolify and a
# STUN/TURN service, and Kestra is a JVM: given no limit it takes what it finds.

volumes:
  kestra-postgres-data:
    driver: local
  kestra-storage:
    driver: local

services:
  postgres:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    volumes:
      - kestra-postgres-data:/var/lib/postgresql
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d $${POSTGRES_DB} -U $${POSTGRES_USER}"]
      interval: 30s
      timeout: 10s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 1g

  kestra:
    build:
      context: .
      dockerfile: Dockerfile
    image: abzum-vortex-kestra:v1.0.57-operations.1
    restart: unless-stopped
    stop_grace_period: 6m
    user: "root"
    command: server standalone --flow-path /app/vortex-flows
    volumes:
      - kestra-storage:/app/storage
      - /tmp/kestra-wd:/tmp/kestra-wd
    environment:
      SERVICE_FQDN_KESTRA_8080: /
      SECRET_VORTEX_TESTING_MIGRATION_WEBHOOK_KEY: ${VORTEX_TESTING_MIGRATION_WEBHOOK_KEY_BASE64}
      SECRET_VORTEX_PRODUCTION_MIGRATION_WEBHOOK_KEY: ${VORTEX_PRODUCTION_MIGRATION_WEBHOOK_KEY_BASE64}
      SECRET_VORTEX_TESTING_DOPPLER_TOKEN: ${VORTEX_TESTING_DOPPLER_TOKEN_BASE64}
      SECRET_VORTEX_PRODUCTION_DOPPLER_TOKEN: ${VORTEX_PRODUCTION_DOPPLER_TOKEN_BASE64}
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          anonymous-usage-report:
            enabled: false
          ui-anonymous-usage-report:
            enabled: false
          tutorialFlows:
            enabled: false
          server:
            basic-auth:
              enabled: true
              username: ${KESTRA_BASIC_AUTH_USERNAME}
              password: ${KESTRA_BASIC_AUTH_PASSWORD}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: ${KESTRA_PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 3g
