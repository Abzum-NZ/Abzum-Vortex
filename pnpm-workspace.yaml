packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: false
catalog:
  "@eslint/js": 10.0.1
  eslint: 10.13.0
  prettier: 3.9.10
  turbo: 2.11.10
  typescript-eslint: 8.72.0
  react-dom: 19.3.1
  next: 16.4.3
  zod: 4.6.7
  server-only: 0.0.1
  "@types/react-dom": 19.3.0
  "@tabler/icons-react": 3.49.0
  lucide-react: 1.61.0
  motion: 14.6.0
  "@base-ui/react": 1.9.0
  "@types/node": 26.6.5
  typescript: 6.0.3
  "@js-temporal/polyfill": 0.5.1
  "@puckeditor/core": 0.23.0
  "@supabase/ssr": 0.12.7
  "@supabase/supabase-js": 2.118.0
  "@tailwindcss/postcss": 4.3.3
  "@types/semver": 7.8.0
  "@types/react": 19.3.0
  "@types/ws": 8.18.2
  postgres: 3.4.9
  react: 19.3.1
  react-day-picker: 10.0.2
  semver: 7.8.5
  supabase: 2.122.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  ws: 8.22.0
  sonner: 2.0.8
  knip: 6.43.0
  re2js: 2.9.1
  "@xyflow/react": 12.12.0
  "@tanstack/react-table": 9.3.1
  "@tanstack/react-virtual": 3.14.23
  file-type: 22.2.0
  exceljs: 4.4.0
  "@noble/hashes": 2.4.0

catalogMode: strict

saveExact: true
strictPeerDependencies: true

# motion's own packages float on caret ranges; hold them to the pinned motion release.
overrides:
  "exceljs>uuid": 11.1.1
  framer-motion: 14.6.0
  motion-dom: 14.6.0
  motion-utils: 14.6.0
  happy-dom: 21.0.4

# Reject writes queued after socket closure until the driver ships the fix.
# https://github.com/porsager/postgres/pull/1209
patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
minimumReleaseAgeExclude:
  - re2js@2.9.1
