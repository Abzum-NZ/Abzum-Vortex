packages:
  - apps/*
  - packages/*
allowBuilds:
  esbuild: false
catalog:
  "@js-temporal/polyfill": 0.5.1
  "@puckeditor/core": 0.23.0
  "@supabase/ssr": 0.12.7
  "@supabase/supabase-js": 2.116.0
  "@tailwindcss/postcss": 4.3.3
  "@types/semver": 7.8.0
  "@types/react": 19.3.0
  "@types/ws": 8.18.1
  date-fns: 4.4.0
  postgres: 3.4.9
  react: 19.3.0
  react-day-picker: 10.0.1
  semver: 7.8.5
  supabase: 2.117.0
  tailwindcss: 4.3.3
  tsx: 4.23.15
  ws: 8.21.3
  sonner: 2.0.8
  knip: 5.63.0
  re2js: 2.8.6
  "@xyflow/react": 12.12.0
  "@tanstack/react-table": 8.21.3
  "@tanstack/react-virtual": 3.14.21
  file-type: 22.2.0
  exceljs: 4.4.0
  '@noble/hashes': 1.8.0

catalogMode: strict

saveExact: true
strictPeerDependencies: true

# motion's own packages float on caret ranges; hold them to the pinned motion release.
overrides:
  framer-motion: 13.4.6
  motion-dom: 13.4.5
  motion-utils: 13.3.0

# Reject writes queued after socket closure until the driver ships the fix.
# https://github.com/porsager/postgres/pull/1209
patchedDependencies:
  postgres@3.4.9: patches/postgres@3.4.9.patch
