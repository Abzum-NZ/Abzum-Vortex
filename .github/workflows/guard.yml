name: Guardrails

on:
  pull_request:

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The migration-version-order guard rule compares against origin/main, which a default
      # pull_request checkout does not fetch. Full history lets the guard verify that a migration
      # branch contains this fetched main commit.
      - run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm guard
      - run: pnpm audit --audit-level high
