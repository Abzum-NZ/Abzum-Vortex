name: Complete fixture validation

on:
  pull_request:
    paths:
      - "testing/fixtures/**"
      - ".github/workflows/fixture-validation.yml"
  push:
    branches: [main, testing]
    paths:
      - "testing/fixtures/**"
      - ".github/workflows/fixture-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - name: Validate complete CRM and Service Desk definitions
        run: node testing/fixtures/validate-fixtures.mjs
