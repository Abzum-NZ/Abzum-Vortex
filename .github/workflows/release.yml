name: Release

# This workflow does not deploy. Vercel deploys `main` to production on merge,
# tag or no tag, so nothing here stands between a change and production.
#
# What it does is keep the record. A release tagged from `main` gets its notes
# published, so the rollback in Chapter 24 has something to name and the
# deployment record says what shipped. It runs on a tag and on nothing else, so
# it is not in the path of an ordinary change.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Publish release notes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main' \
            || { echo 'A release tag must point at a commit on main.'; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
