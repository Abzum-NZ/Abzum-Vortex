name: Release

# A release is tagged from main after the change has been through testing.
# Vercel's Git integration deploys main to production; this workflow records the
# release against the Production environment and publishes the release notes.

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  deployments: write

jobs:
  release:
    name: Publish release
    runs-on: ubuntu-latest
    environment: Production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag is on main
        run: |
          git branch -r --contains "$GITHUB_SHA" | grep -q 'origin/main' \
            || { echo 'A release tag must point at a commit on main.'; exit 1; }

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
