name: CI

# This workflow is the gate, not the deployer.
#
# Vercel's Git integration builds and deploys on its own: a preview per pull
# request, the `testing` branch at its own alias, and `main` to production. It
# needs nothing from here.
#
# What stops a bad change moving from `testing` to `main` is branch protection,
# and what branch protection requires is this job. So Actions is deliberately in
# the promotion path and deliberately out of the deployment path.
#
# It runs only what Vercel does not: types, linting, the package boundary rules,
# unit tests and the database access-rule tests. It does not build, because
# Vercel already builds every pull request and its check is required alongside
# this one. Building twice doubles the wall time and adds no signal.
#
# It holds no credential. The access-rule tests run against a throwaway Postgres
# in the runner, never against the Supabase project, so no connection string is
# stored in Actions.

on:
  pull_request:

# One run per pull request: a new push supersedes the run still going, which
# will matter more as this job grows past the seconds it takes today.
#
# The group is namespaced by workflow name. `ci-${{ github.ref }}` was not, and
# that is a trap worth avoiding: any second workflow adopting the same shape
# would share the group and cancel this one, and a superseded run reports to
# branch protection as a failure rather than as "never mind" — so a collision
# does not just waste a run, it blocks the merge.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The workspace does not exist yet. Until the root package.json lands in
      # phase 1, this records that there is nothing to check and passes, so
      # branch protection can require this job from the first commit.
      - name: Detect workspace
        id: app
        run: |
          if [ -f package.json ]; then echo "present=true" >> "$GITHUB_OUTPUT"; else echo "present=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v4
        if: steps.app.outputs.present == 'true'
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        if: steps.app.outputs.present == 'true'
        run: npm ci

      - name: Types
        if: steps.app.outputs.present == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.app.outputs.present == 'true'
        run: npm run lint

      - name: Package boundaries
        if: steps.app.outputs.present == 'true'
        run: npm run boundaries
        # Direction, environment and shipping rules. Wired in phase 1 by #10.

      - name: Unit tests
        if: steps.app.outputs.present == 'true'
        run: npm test

      - name: Database access-rule tests
        if: steps.app.outputs.present == 'true'
        run: npm run test:access
        # Wired in phase 2, against a Postgres service container declared here at
        # that point. The isolation suite runs twice: as the application account,
        # where every case must be refused, and as the owner of the tables, where
        # every case must succeed.

      - name: Nothing to check yet
        if: steps.app.outputs.present == 'false'
        run: echo "No workspace present. This passes until phase 1 lands the workspace root."
